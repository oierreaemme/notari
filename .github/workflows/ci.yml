name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 17
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"

jobs:
  static-analysis:
    name: Static analysis (detekt, ktlint, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Detekt
        run: ./gradlew detekt --no-configuration-cache

      - name: ktlint
        run: ./gradlew ktlintCheck --no-configuration-cache

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/ktlint/
            **/build/reports/lint-results-*.html

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

      # Coverage gate (>80% on domain + data layers — see CLAUDE.md §7).
      # Wired up once we add Jacoco.
      # - name: Coverage gate
      #   run: ./gradlew jacocoTestCoverageVerification

  # Screenshot-test job removed for now. The Roborazzi Gradle plugin is declared
  # in the version catalog but not yet applied to any module, so `verifyRoborazzi`
  # / `recordRoborazzi` are not registered as tasks — the job could only ever fail
  # with "task not found". Rather than ship a permanently-red (or noisy
  # continue-on-error) job that tests nothing, the job is removed until the
  # screenshot-testing setup is actually wired: apply the Roborazzi plugin to the
  # feature modules, write the screenshot tests, record baselines, then re-add a
  # gating `verifyRoborazzi` job here. Tracked as post-submission technical debt.

  privacy-gate:
    name: Privacy gate — no INTERNET permission in merged manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build merged manifests
        run: ./gradlew :app:processReleaseManifest :app:processDebugManifest

      - name: Verify no INTERNET permission
        run: ./scripts/check-no-internet-permission.sh

  assemble:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, privacy-gate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
